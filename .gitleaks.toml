# gitleaks configuration (E03-T07 security lane, SR-13x secrets scanning).
# Extends the default ruleset; only *narrows* where the default demonstrably
# false-positives on this repository. Never allowlist source code.
title = "CandleViewer gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Known non-secrets"
# 1) Planning/contract docs redact every example credential with the literal
#    word REDACTED (docs/plan/22-api-openapi.yaml, 23-ws-protocol.md ...).
# 2) docs/research/xstate/** are third-party-library battle-test artefacts:
#    the "secrets" there are dummy strings used to *test* log redaction.
#    Research is not shipped code (docs/design/README.md, C-1.3).
paths = [
  '''docs/research/xstate/.*''',
  '''docs/plan/backlog/all-tickets\.json''',   # generated from E*.json (covered there)
]
regexes = [
  '''(?i)["'`]?REDACTED["'`]?''',
]
