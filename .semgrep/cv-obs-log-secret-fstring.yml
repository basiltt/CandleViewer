rules:
  - id: cv-obs-log-secret-fstring
    languages: [python]
    severity: ERROR
    message: >-
      A secret-named variable is interpolated into a log message via
      f-string or %-formatting (SR-120 "no free-form string interpolation",
      SR-122, E04-X02). Pass structured key/values and `Secret` wrappers.
    metadata:
      rule-id: cv-obs-log-secret-fstring
    patterns:
      - pattern-either:
          - pattern: $L.$M($MSG, ...)
          - pattern: $L.$M("..." % $MSG, ...)
      - metavariable-regex:
          metavariable: $M
          regex: '^(debug|info|warning|warn|error|exception|critical|log)$'
      - metavariable-regex:
          metavariable: $MSG
          regex: '(?is)(^f.*[{].*(secret|password|passwd|token|api_?key|signature|credential|totp|cookie)|^[a-z_]*(secret|password|passwd|token|api_?key|signature|credential|totp|cookie)[a-z_]*$)'
    paths:
      include:
        - "**"
      exclude:
        - "services/**/tests/**"
        - "**/test_*.py"
