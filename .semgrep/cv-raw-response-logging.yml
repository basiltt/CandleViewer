rules:
  - id: cv-raw-response-logging
    languages: [python]
    severity: ERROR
    message: >-
      A raw exchange response, request headers, or a variable named like a
      key/secret/signature is being logged, used as a metric label, or set
      as a span attribute. Never log, print, metric-label or span-tag a raw
      exchange response/headers/secret (CONSTITUTION C-12.6, E08-X03 ticket
      scenario "Raw response logging is caught before review"); redact
      first via the adapter's own `_redact` helper and pass only
      non-secret, non-vocabulary-leaking metadata.
    metadata:
      rule-id: cv-raw-response-logging
    patterns:
      - pattern-either:
          - pattern: logger.$METHOD(..., $RESP, ...)
          - pattern: logger.$METHOD(..., $KW=$RESP, ...)
          - pattern: logging.$METHOD(..., $RESP, ...)
          - pattern: $SPAN.set_attribute($ATTR, $RESP)
          - pattern: $METRIC.labels(..., $RESP, ...)
          - pattern: $METRIC.labels(..., $KW=$RESP, ...)
      - metavariable-regex:
          metavariable: $RESP
          regex: "(?i)^(response|resp|raw_response|raw_resp|headers|raw_headers|api_key|api_secret|secret|signature|sign)$"
    paths:
      exclude:
        - "services/**/tests/**"
        - "apps/**/tests/**"
        - "packages/**/tests/**"
        - "**/test_*.py"
        - "**/*_test.py"
