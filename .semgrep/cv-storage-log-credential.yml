rules:
  - id: cv-storage-log-credential
    languages: [python]
    severity: ERROR
    message: >-
      Logging a variable named dsn/password/secret/token in storage/**.
      Threat: credential disclosure via logs (C-12.6, E07 information
      disclosure). Log only masked metadata.
    metadata:
      rule-id: cv-storage-log-credential
    patterns:
      - pattern-either:
          - pattern: $L.$M(..., $V, ...)
          - pattern: $L.$M(..., $K=$V, ...)
          - pattern: $L.$M(f"...{$V}...", ...)
      - metavariable-regex:
          metavariable: $L
          regex: '^(logger|log|logging|_log|_logger)$'
      - metavariable-regex:
          metavariable: $V
          regex: '^(dsn|password|secret|token|[a-z_]*_(dsn|password|secret|token))$'
    paths:
      include:
        - "services/api/candleviewer/storage/**"
        - "**/cv-storage-log-credential*"
