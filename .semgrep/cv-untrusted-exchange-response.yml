rules:
  - id: cv-untrusted-exchange-response
    languages: [python]
    severity: ERROR
    message: >-
      SR-040: a raw exchange payload field is consumed outside the adapter's
      validation layer. Every exchange response is untrusted input and must be
      parsed by the adapter (`exchange/bybit/` models + `exchange/base/boundary.py`)
      into a normalised domain type before any other module reads it; reaching into
      the wire envelope (`result`, `list`, `retCode`, `nextPageCursor`, ...) or calling
      `.json()` on an exchange HTTP response elsewhere skips the schema, bounds and
      `confirm` checks (SR-040/SR-040b; C-2.2/C-2.3). Fix: add or reuse an adapter
      parser that returns a domain model and consume that. Rule doc:
      docs/plan/security/ci-gates-e12.md#cv-untrusted-exchange-response.
    metadata:
      rule-id: cv-untrusted-exchange-response
      sr: SR-040
      references:
        - docs/plan/04-security-program.md SR-040, SR-040b
        - CONSTITUTION.md C-2.2, C-2.3
        - docs/plan/security/ci-gates-e12.md
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $P["$K"]
                  - pattern: $P.get("$K", ...)
              - metavariable-regex:
                  metavariable: $K
                  regex: '^(result|retCode|retMsg|retExtInfo|nextPageCursor|timeNano|timeSecond)$'
          - patterns:
              - pattern: $RESP.json()
              - metavariable-regex:
                  metavariable: $RESP
                  regex: '(?i)^(resp|response|r|res|payload|reply)$'
    paths:
      # Same boundary as cv-adapter-isolation / cv-bybit-vocabulary-leak: the adapter is
      # the validation layer; everything else in the backend consumes domain types.
      include:
        - "services/api/candleviewer/**"
        - "**/cv-untrusted-exchange-response*"
      exclude:
        - "services/api/candleviewer/exchange/bybit/**"
        - "services/api/candleviewer/exchange/base/**"
        - "**/conftest.py"
        - "**/test_*.py"
        - "**/*_test.py"
