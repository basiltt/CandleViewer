rules:
  - id: cv-secret-shaped-literal
    languages: [python]
    severity: ERROR
    message: >-
      This string literal looks secret-shaped (long high-entropy token,
      or an assignment to a variable named like a credential). Exchange
      API keys/secrets are envelope-encrypted and only ever plaintext in
      memory inside services/api/candleviewer/secrets/ (CONSTITUTION.md
      C-2.7, C-12.2). Never hardcode a key/secret/token/password literal.
    metadata:
      rule-id: cv-secret-shaped-literal
    patterns:
      - pattern-either:
          - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: '(?i)^(api_?key|api_?secret|secret_?key|access_?token|password|signature)$'
    paths:
      exclude:
        - "services/**/tests/**"
        - "apps/**/tests/**"
        - "packages/**/tests/**"
        - "**/test_*.py"
        - "**/*_test.py"
        - "**/conftest.py"
        - "services/api/candleviewer/secrets/**"
