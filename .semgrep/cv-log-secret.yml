rules:
  - id: cv-log-secret
    languages: [python]
    severity: ERROR
    message: >-
      A logging call is passing a settings/config object or a field named
      like a secret (key/secret/token/password/signature) as an argument.
      Never log, print or serialise secrets, signatures or session tokens
      (CONSTITUTION.md C-12.6); use the redaction filter and only pass
      masked metadata.
    metadata:
      rule-id: cv-log-secret
    patterns:
      - pattern-either:
          - pattern: logger.$METHOD(..., $SETTINGS, ...)
          - pattern: logging.$METHOD(..., $SETTINGS, ...)
          - pattern: logger.$METHOD(..., $KW=$SETTINGS, ...)
      - metavariable-regex:
          metavariable: $SETTINGS
          regex: '(?i)(settings|config|secret|api_key|token|password|signature)'
    paths:
      exclude:
        - "**/tests/**"
        - "**/test_*.py"
        - "**/*_test.py"
