name: _job-migrations

# E03-T10: Alembic migration job — single-head, drift, expand/contract lint,
# `IF NOT EXISTS` ban, greenfield + previous-release upgrade paths, and the
# concurrent-boot advisory-lock integration test. Applicable when the
# `migrations` path filter is true (`docs/plan/21-database-schema.md` §9,
# ADR-0013 rule 9). Also called from a future release workflow before the
# deploy stage (E03-T09 dependency) so a bad migration never reaches a
# running environment — that call site is added by E03-T09 itself; this
# file only defines the reusable job.
#
# CV-ERR codes: CI-MIG-001 multiple heads, CI-MIG-002 drift, CI-MIG-003
# destructive without annotation, CI-MIG-004 upgrade-path failure,
# CI-MIG-005 `IF NOT EXISTS` used.

on:
  workflow_call: {}

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    services:
      postgres:
        image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
        env:
          POSTGRES_USER: cv
          POSTGRES_PASSWORD: cv
          POSTGRES_DB: candleviewer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cv -d candleviewer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen (fails if pyproject.toml drifted from uv.lock)
        run: uv sync --frozen --all-groups

      - name: CV_PG_DSN for the service container (loopback only, CI-only creds)
        run: echo "CV_PG_DSN=postgresql+asyncpg://cv:cv@localhost:5432/candleviewer" >> "$GITHUB_ENV"

      - name: alembic heads — single linear history (CI-MIG-001)
        run: |
          heads="$(uv run alembic heads)"
          count="$(printf '%s\n' "$heads" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "CI-MIG-001: expected 1 head, found $count:"
            printf '%s\n' "$heads"
            exit 1
          fi
          echo "single head: $heads"

      - name: Expand/contract lint — destructive ops need cv:contract-phase (CI-MIG-003)
        run: uv run python ../../tools/ci/migration_lint.py --versions-dir candleviewer/migrations/versions

      - name: alembic upgrade head — greenfield (empty database)
        run: uv run alembic upgrade head

      # `alembic check` compares models.py against the *live* schema at head, so
      # it must run after `upgrade head` — on an empty database it always fails
      # with "Target database is not up to date" regardless of models.py.
      - name: alembic check — drift between models.py and head (CI-MIG-002)
        run: uv run alembic check

      - name: alembic downgrade to base then upgrade head again (round-trip sanity)
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Upgrade path from the previous release tag's schema (CI-MIG-004)
        run: python ../../tools/ci/run_previous_release_upgrade.py --root . --dsn "$CV_PG_DSN"

      - name: Concurrent-boot advisory-lock integration test
        run: uv run pytest -p no:cacheprovider -m integration tests/integration/migrations/test_boot_advisory_lock_integration.py --no-cov
