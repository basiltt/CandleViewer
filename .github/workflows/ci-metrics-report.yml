name: ci-metrics-report

# E03-T15: weekly PR-feedback-time report (ADR-0013 §Validation — "Measure
# PR feedback time weekly and rebalance if p90 exceeds 15 minutes"). Reads
# `ci-metrics` artifacts emitted by pr.yml's ci-required resolver (E03-T01)
# and publishes p50/p90 to the job summary; see docs/ci-runbook.md §10.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  weekly-feedback-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Download the trailing week of ci-metrics artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        continue-on-error: true
        with:
          path: ci-metrics
          pattern: ci-metrics-*
          merge-multiple: true

      - name: Render weekly feedback-time report
        id: report
        run: |
          python tools/ci/ci_feedback_time_report.py \
            --metrics-dir ci-metrics \
            --window-days 7 \
            --budget-minutes 15 \
            --output feedback-report.md
          cat feedback-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "rebalance_triggered=$(grep -q '::warning::' feedback-report.md && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Open/update rebalance-tracking issue
        if: ${{ steps.report.outputs.rebalance_triggered == 'true' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('feedback-report.md', 'utf8');
            const title = 'CI pipeline rebalance: p90 PR feedback time over budget';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-rebalance',
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['priority/p2-medium', 'area/infra-devops', 'ci-rebalance'],
              });
            }
