name: defect-triage

# E49-T01: DoR validation on bug open/edit, daily SLA sweep + digest, and the
# regression-guard check. Logic lives in tools/triage (unit-tested offline).
# Never uses pull_request_target and never checks out untrusted PR code with a
# write token in scope (SR-132; docs/plan/04-security-program.md).
# Secrets: TRIAGE_TOKEN (fine-grained, this repo + project only), TRIAGE_DIGEST_WEBHOOK.

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: "0 8 * * 1-5" # business-day digest, 08:00 UTC
  workflow_dispatch:
    inputs:
      sweep:
        description: "Run the one-time existing-debt sweep (re-grade open bugs)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: defect-triage-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  dor:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'type/bug')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml==6.0.2
      - name: Validate bug DoR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m tools.triage.run dor --number "${{ github.event.issue.number }}"

  sla:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml==6.0.2
      - name: SLA sweep and digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRIAGE_CALENDAR_PATH: tools/triage/calendar.yml
          TRIAGE_DIGEST_WEBHOOK: ${{ secrets.TRIAGE_DIGEST_WEBHOOK }}
          TRIAGE_PROJECT_ID: ${{ secrets.TRIAGE_PROJECT_ID }}
        run: python -m tools.triage.run sla

  sweep:
    if: github.event_name == 'workflow_dispatch' && inputs.sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml==6.0.2
      - name: One-time debt sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m tools.triage.run sweep
