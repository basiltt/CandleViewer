name: _job-integration

# E03-T06: integration lane (ADR-0013 pipeline shape "[integration] fixture-driven
# pipeline + OMS fake-exchange suite", CONSTITUTION §9 check 7).
#
# Two suites:
#   1. Fixture-driven pipeline (`services/api/tests/integration/pipeline/`):
#      fixture manifest + checksum verification (CI-INT-001/002) then the
#      recorded-fixture -> normalised-events replay. Runs with outbound
#      network denied except loopback (`_ci_network_guard.py`, autouse).
#   2. `-m integration` suites needing Postgres/QuestDB (currently the
#      identity/RBAC migration round-trip, `tests/integration/auth/`) —
#      these spin their own service container via testcontainers, which
#      needs Docker; `services=docker` is available on GitHub-hosted
#      ubuntu runners.
#
# The OMS fake-exchange suite (per ADR-0012's table) has no product logic
# to exercise yet — `oms/service.py` is an R0 scaffold with no order
# lifecycle implemented (ticket "Out of scope": "product E2E specs,
# contract fixtures ... for features that do not exist yet"). The lane
# exists and is wired here; it activates automatically as `unit/exchange`
# and `oms` gain real logic under the existing `-m integration` marker.

on:
  workflow_call: {}

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  CV_CI_ALLOWED_HOSTS: ""

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen --all-groups
        working-directory: services/api
        run: uv sync --frozen --all-groups

      - name: Verify fixture manifest (CI-INT-001 fixture unavailable, CI-INT-002 checksum mismatch)
        run: python tools/ci/verify_fixture_manifest.py --manifest tests/fixtures/MANIFEST.sha256 --repo-root .

      - name: Fixture-driven pipeline suite (network denied except loopback)
        working-directory: services/api
        run: uv run pytest tests/integration/pipeline -m "not integration" --no-cov

      - name: Postgres/QuestDB-backed integration suite (testcontainers, needs Docker)
        working-directory: services/api
        run: uv run pytest tests/integration -m integration --no-cov -rA

      - name: Upload restore-drill report (E07-X02 SR-093)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: restore-drill-report
          path: services/api/build/reports/restore-drill.json
          if-no-files-found: error

      - name: SR-047 runtime listener probe on the compose data stores (E07-X02)
        env:
          # CI-only throwaway; the stores hold no data and bind loopback only.
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}
          GF_SECURITY_ADMIN_PASSWORD: ci-only-${{ github.run_id }}
          MINIO_ROOT_PASSWORD: ci-only-${{ github.run_id }}
          CV_ALERT_PAGE_WEBHOOK_URL: http://127.0.0.1:1/unused
          CV_ALERT_TICKET_WEBHOOK_URL: http://127.0.0.1:1/unused
          CV_ALERT_DEADMAN_URL: http://127.0.0.1:1/unused
          CV_LISTENER_PROBE: "1"
          COMPOSE_PROFILES: core
        run: |
          # questdb: its compose healthcheck reports unhealthy on the runner (tracked separately);
          # the probe needs only its published sockets, so it is started without --wait.
          docker compose -f infra/compose/docker-compose.yml --profile core up -d --wait postgres
          docker compose -f infra/compose/docker-compose.yml --profile core up -d questdb
          cd services/api
          uv run pytest tests/integration/security/test_sr047_listener_probe.py -m integration --no-cov -s -p no:cacheprovider

      - name: Stop compose data stores
        if: always()
        env:
          POSTGRES_PASSWORD: unused
          GF_SECURITY_ADMIN_PASSWORD: unused
          MINIO_ROOT_PASSWORD: unused
        run: docker compose -f infra/compose/docker-compose.yml --profile core down -v || true

      - name: Grafana live render suite (E04-S01 AC1/AC2)
        env:
          GF_SECURITY_ADMIN_USER: admin
          GF_SECURITY_ADMIN_PASSWORD: ci-only-${{ github.run_id }}
          GRAFANA_URL: http://127.0.0.1:3001
          PROM_STUB_PORT: "9090"
          GRAFANA_CONTAINER: cv-grafana
        run: |
          # Image + digest copied from infra/compose/docker-compose.yml (verified by pin-check).
          IMG=$(grep -m1 'image: grafana/grafana' infra/compose/docker-compose.yml | awk '{print $2}')
          # Host network so Grafana's datasource proxy reaches the stub Prometheus on loopback.
          # Provisioning + dashboards are mounted; "prometheus" resolves to loopback where the stub listens.
          docker run -d --name cv-grafana --network host --add-host prometheus:127.0.0.1             -e GF_SERVER_HTTP_PORT=3001 -e GF_SECURITY_ADMIN_USER -e GF_SECURITY_ADMIN_PASSWORD             -v "$PWD/infra/grafana/provisioning:/etc/grafana/provisioning:ro"             -v "$PWD/infra/grafana/dashboards:/var/lib/grafana/dashboards:ro" "$IMG"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then docker logs cv-grafana; echo "Grafana never became healthy"; exit 1; fi
          cd services/api
          uv run pytest ../../infra/grafana/tests/test_live_render.py -m integration --no-cov -p no:cacheprovider

      - name: Remove Grafana container
        if: always()
        run: docker rm -f cv-grafana || true

      - name: Assert no live-exchange egress occurred
        if: always()
        run: |
          echo "Network guard (services/api/tests/_ci_network_guard.py) denies any non-loopback"
          echo "connect() for the whole run; a test reaching api.bybit.com raises NetworkGuardViolation"
          echo "and fails this job rather than silently succeeding."
