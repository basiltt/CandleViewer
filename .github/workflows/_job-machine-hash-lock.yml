name: _job-machine-hash-lock

# E50-T02: CI-blocking gate for `services/api/candleviewer/statechart/
# machines/machine_hashes.lock`. A chart edit that changes `machine_hash`
# without a chart `version` bump AND a registered upcaster
# (`candleviewer.statechart.upcasters`) fails the build, naming the machine
# (MUST-12/MUSTNOT-09, 29-statechart-adoption-plan.md §1.5).
#
# Needs the full `services/api` environment (not stdlib-only like
# `_job-statechart-lint.yml`) because loading the registry through
# `candleviewer.statechart` imports `factory.py`, which imports the pinned
# `xstate_statemachine` runtime.

on:
  workflow_call: {}

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  machine-hash-lock:
    name: machine-hash-lock
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CV_CI_TIMEOUT_MINUTES || 20) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv (cache keyed on uv.lock)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"
          python-version: "3.12"

      - name: uv sync --frozen (fails if pyproject.toml drifted from uv.lock)
        working-directory: services/api
        run: uv sync --frozen --all-groups

      - name: Diff registry machine_hash values against machine_hashes.lock
        run: >
          uv run --project services/api
          python tools/statechart/check_machine_hash_lock.py

      - name: Golden-snapshot upcaster suite (part of xstate_contract)
        working-directory: services/api
        run: uv run pytest tests/xstate_contract -q --no-cov -W error::RuntimeWarning
