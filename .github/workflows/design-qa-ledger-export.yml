name: design-qa-ledger-export

# E49-T02: push design_qa_findings_open{severity} to the pushgateway when the ledger changes
# on main, and hourly. Reads one repo file; the only secret is the (tailnet) pushgateway URL.
on:
  push:
    branches: [main]
    paths:
      - docs/plan/backlog/artifacts/e49-design-qa-ledger.csv
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-qa-ledger-export
  cancel-in-progress: false

jobs:
  export:
    if: github.repository_owner != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Push ledger counts
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
        run: python -m tools.ga_defects.run ledger
