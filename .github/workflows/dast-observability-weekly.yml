name: dast-observability-weekly

# E04-X02: scheduled OWASP ZAP baseline scoped to the observability endpoints.
# Targets a locally-started stack only. Medium findings need a dated entry in
# security/accepted-risks.yaml (R0 gate); Critical/High fail the job.
on:
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Observability security smoke (permissions, secrets, workflows)
        run: python infra/scripts/obs_security_checks.py
      - name: Start stack
        run: docker compose -f infra/compose/docker-compose.yml up -d --wait
      - name: ZAP baseline (observability endpoints)
        run: |
          docker run --rm --network host -v "$PWD:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8000 -c infra/scripts/zap-observability.conf -I
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v
