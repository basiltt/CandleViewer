name: deploy-staging

# E03-T09: gated staging deploy (staging = Bybit demo, `01-sdlc-and-branching.md`
# §9) plus the rollback path shared with dev. Bound to the GitHub Environment
# `staging`, which carries required reviewers and a deployment branch policy
# restricting it to `main`/`release/*` (SR-141 environment protection) —
# configured once in repo Settings -> Environments; this workflow only
# references the environment name, it does not (and cannot) create the
# protection rule itself.
#
# Unlike dev, a failed staging smoke test never auto-rolls-back (ticket
# "Technical notes": a half-rolled-back staging environment mid-soak is
# harder to reason about than a stopped one) — it alerts and stops.
#
# Error codes: CI-DEP-001..004, same meanings as `deploy-dev.yml`.

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Image digest to deploy (sha256:...); required unless rollback_to_digest is set"
        required: false
        default: ""
      sha:
        description: "Git sha the digest was built from"
        required: false
        default: ""
      rollback_to_digest:
        description: "Redeploy this previously-deployed digest instead of a new one (no down-migration, ADR-0013 rule 9)"
        required: false
        default: ""
  push:
    branches: ["release/*"]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/candleviewer-api

jobs:
  deploy-staging:
    name: deploy-staging
    runs-on: [self-hosted, staging-host]
    timeout-minutes: 15
    # SR-141: required reviewers + deployment branch policy (main/release/*)
    # are configured on this named Environment in repo Settings; dispatch
    # waits at this gate for a required reviewer's approval and is
    # auto-cancelled by GitHub after the environment's configured wait
    # timer if nobody approves (acceptance scenario "Staging requires a
    # named reviewer").
    environment:
      name: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9101 # v3.7.0

      - name: Resolve target digest/sha (forward deploy or rollback)
        id: target
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.rollback_to_digest }}" ]; then
            echo "digest=${{ inputs.rollback_to_digest }}" >> "$GITHUB_OUTPUT"
            echo "sha=rollback" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.digest }}" ]; then
            echo "digest=${{ inputs.digest }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ inputs.sha }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="$(git rev-parse --short=12 HEAD)"
            DIGEST="$(docker buildx imagetools inspect \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev" --format '{{json .Manifest}}' \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['digest'])")"
            echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy by digest, verify + smoke test — no auto-rollback (staging)
        run: |
          python3 tools/ci/deploy_dev.py \
            --image-ref "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
            --digest "${{ steps.target.outputs.digest }}" \
            --sha "${{ steps.target.outputs.sha }}" \
            --environment staging \
            --actor "${{ github.actor }}" \
            --repository "${{ github.repository }}" \
            --base-url "http://127.0.0.1:8001" \
            --no-auto-rollback

      - name: Staging smoke — demo-rest-only E2E subset (E03-T06; empty until R3)
        run: |
          if [ -d apps/web/e2e/demo-rest-only ] && [ -n "$(ls -A apps/web/e2e/demo-rest-only 2>/dev/null)" ]; then
            pnpm --filter @candleviewer/web exec playwright test --grep @demo-rest-only
          else
            echo "no @demo-rest-only specs registered yet (mandatory from R3 per the ticket) — skipping"
          fi

      - name: Commit the updated deployment ledger
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet -- deployments/ledger.jsonl; then
            echo "no ledger change to commit"
            exit 0
          fi
          git config user.name "candleviewer-ci[bot]"
          git config user.email "ci@users.noreply.github.com"
          git add deployments/ledger.jsonl
          git commit -m "chore(infra-devops): record staging deploy ${{ steps.target.outputs.sha }} [skip ci]"
          git push origin HEAD:main

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Staging deploy"
            echo "- sha: \`${{ steps.target.outputs.sha }}\`"
            echo "- digest: \`${{ steps.target.outputs.digest }}\`"
            echo "- rollback: \`${{ inputs.rollback_to_digest != '' }}\`"
            tail -n 1 deployments/ledger.jsonl 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
