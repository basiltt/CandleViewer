name: _job-a11y

# E47-T02: the accessibility gate set (05-accessibility-standard.md section 9),
# required as the `a11y` check (CONSTITUTION C-9.1 #9). Decision logic lives in
# tools/a11y/gates.py: exit 1 = violation (A11Y-G0xx), exit 3 = infrastructure
# error (A11Y-INFRA). Break-glass: CV_A11Y_INFRA_WAIVER_UNTIL (repo variable,
# ISO-8601 UTC, max 24h ahead) waives infra errors only, never violations.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  a11y:
    name: a11y
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CV_A11Y_INFRA_WAIVER_UNTIL: ${{ vars.CV_A11Y_INFRA_WAIVER_UNTIL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: "20"

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Gate logic meta-tests (injected defect fails, clean passes)
        run: pip install pytest && python -m pytest scripts/tests/test_a11y_gates.py -q

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@12.5.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contrast-token linter (A11Y-C001..C003)
        run: pnpm --filter @candleviewer/ui run contrast:gate

      - name: Build web app
        run: pnpm --filter @candleviewer/web run build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: axe + keyboard + tree + flash + Lighthouse collectors
        # Collectors emit JSON under reports/a11y/ (absent until the
        # screen/collector tickets land; reported as a notice, never silently green); gates.py then decides pass/fail with text output.
        run: |
          set +e
          for g in "axe reports/a11y/axe.json" "lighthouse reports/a11y/lighthouse.json" \
                   "keyboard reports/a11y/keyboard.json" "flash reports/a11y/flash.json" \
                   "tree reports/a11y/trees"; do
            set -- $g
            if [ ! -e "$2" ]; then
              echo "::notice::a11y gate '$1' collector not landed yet ($2 absent) - not evaluated"
              continue
            fi
            python -m tools.a11y.gates $g | tee -a "$GITHUB_STEP_SUMMARY"
            rc=${PIPESTATUS[0]}
            [ "$rc" -ne 0 ] && fail=$rc
          done
          exit ${fail:-0}
