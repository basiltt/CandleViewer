name: bar-determinism-nightly
# E12-T04: full bar-builder determinism harness — 1M seeded synthetic trades x the standard spec
# matrix (all six builders), BI-1..BI-6 + reference cross-check, and rebuild throughput vs the
# committed baseline (WARN > 10 %, FAIL > 25 % - but only when the runner OS matches the
# baseline's; the committed baseline is Windows dev hardware, so on ubuntu every drop only WARNs
# until a Linux baseline is re-recorded on the CI runner, tracked in #2167). The PR-gate subset (100k trades) runs inside the
# normal backend pytest job; this nightly is not a new required check (C-9.1 owns that list), and
# a failure here is treated as a build break (ticket opened). Offline: no exchange egress (C-13.5).
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  bar-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CV_ENV: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - id: sync
        run: uv sync --project services/api
      - name: Heavy harness tests (100k + adversarial matrix; deselected from the PR lane)
        id: harness_tests
        working-directory: services/api
        # Every `harness`-marked test under tests/unit/bars (E12-T04 heavy lane + the full BI-1/BI-5
        # sweeps moved here by #2177) — the PR lane deselects the marker.
        run: uv run pytest tests/unit/bars -m harness -q -p no:randomly --no-cov
      - name: Conformance bank, heavy tapes (E12-Q02; dense + gap, full matrix, chunk equivalence)
        id: conformance
        working-directory: services/api
        if: always() && steps.sync.outcome == 'success'
        env:
          CV_CONFORMANCE_SUMMARY: conformance-summary.json
        run: uv run pytest tests/unit/bars/test_conformance_bank.py tests/unit/bars/test_conformance_behaviour.py -m harness -q -p no:randomly --no-cov
      - name: Full harness (1M trades, BI-1..BI-6, reference, throughput vs baseline)
        id: harness
        working-directory: services/api
        if: always() && steps.sync.outcome == 'success'
        run: uv run python -m bench.bar_determinism.run --n 1000000 --out bar-determinism.json
      - name: Open ticket on invariant violation or throughput regression
        if: failure() && (steps.harness.outcome == 'failure' || steps.conformance.outcome == 'failure' || steps.harness_tests.outcome == 'failure') && steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "bars: nightly determinism harness failed ($(date -u +%F))" \
            --label perf --label area/ingestion --label qa \
            --body "bar-determinism-nightly failed (invariant violation, or >25% throughput drop vs a same-OS baseline). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Artifact: bar-determinism-results."
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: bar-determinism-results
          path: services/api/bar-determinism.json
          if-no-files-found: ignore
