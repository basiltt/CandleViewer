name: perf-storage-nightly
# Recorded-not-gating in R0 (30-release-roadmap 4.4): runs nightly, never on PRs.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  storage-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CV_ENV: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - id: sync
        run: uv sync --project services/api
      - name: Proxy harness (DuckDB shapes, regression gate)
        id: proxy
        run: uv run --project services/api python tests/perf/storage/harness.py --out results.json
      - name: Real-engine harness (QuestDB 8.1.1 via testcontainers; docker is preinstalled on ubuntu-latest)
        id: real
        working-directory: services/api
        run: uv run pytest tests/integration/storage/test_storage_perf_harness.py -m "integration and perf" -p no:randomly
      - name: Open ticket on >20% regression
        # Only a perf-gate failure (harness exit 1 / pytest exit 1) opens an issue;
        # infrastructure errors (docker, uv sync, timeouts) fail the job without a regression ticket.
        if: failure() && (steps.proxy.outcome == 'failure' || steps.real.outcome == 'failure') && steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create             --title "perf: storage nightly regression >20% ($(date -u +%F))"             --label perf --label area/backend-platform             --body "storage-perf-nightly failed the 20% baseline gate. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Artifact: storage-perf-results."
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: storage-perf-results
          path: |
            results.json
            services/api/build/reports/storage-perf.json
