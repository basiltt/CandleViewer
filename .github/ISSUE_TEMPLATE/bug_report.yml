name: Bug Report
description: Report a defect against previously Done work
title: "[Bug]: "
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste API keys, session tokens, passwords, or real account/user identifiers into
        this issue. Found a vulnerability? Do not file it here — see `SECURITY.md`.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: >-
        Exact steps + environment (dev/staging/prod) + symbol/account context if relevant.
        Never paste real account ids or keys — redact them.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: >-
        `priority/p0-critical` for anything touching live money/safety invariants, e.g. missing
        native SL on fan-out.
      options:
        - "priority/p0-critical — drop everything"
        - "priority/p1-high"
        - "priority/p2-normal"
        - "priority/p3-low"
    validations:
      required: true
  - type: textarea
    id: root-cause-hypothesis
    attributes:
      label: Root cause hypothesis
      description: >-
        Or write "needs investigation" — if that investigation is itself nontrivial, file a
        Spike instead.
    validations:
      required: false
  - type: input
    id: regression-origin
    attributes:
      label: Regression origin
      description: Linked Story/Epic key, if this is a regression of prior work.
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Web (Desktop Browser)
        - Web (Mobile Browser)
        - Desktop App
        - Other
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: >-
        Paste any relevant logs, stack traces, or screenshots. Redact tokens/keys before
        pasting.
      render: shell
    validations:
      required: false
