rules:
  - id: no-secret-logging
    languages: [python]
    severity: ERROR
    message: >-
      SR-122: a password, token, session id, TOTP code, recovery code, API key
      or invite token reaches a logger (bare name, attribute such as
      body.password, f-string, %-format or .format()). Log an opaque id instead.
    metadata:
      sr: SR-122
    patterns:
      # Any receiver: logger, self.logger, self._log, structlog.get_logger(), ...
      # The method-name regex keeps it to logging calls.
      - pattern-either:
          - pattern: $L.$M(..., <... $V ...>, ...)
          - pattern: $L.$M(..., $K=<... $V ...>, ...)
          - pattern: $L.$M(..., <... $X.$V ...>, ...)
          - pattern: $L.$M(..., $K=<... $X.$V ...>, ...)
      - metavariable-regex:
          metavariable: $M
          regex: "^(debug|info|warning|warn|error|exception|critical|fatal|msg|log)$"
      - metavariable-regex:
          metavariable: $L
          regex: "(?i)^.*(log|logger|logging|get_logger\\(.*\\))$"
      - metavariable-regex:
          metavariable: $V
          regex: "(?i)^(password|passwd|pwd|\\w*_password|secret|\\w*_secret|token|\\w*_token|totp\\w*|otp|recovery_code\\w*|api_key|\\w*_api_key|invite_token)$"
      # session_id is deliberately absent: it is the opaque session *record*
      # id (the safe thing to log); the bearer value is session_token/*_token.
    paths:
      exclude:
        - "**/tests/**"
        # session_id here is a replay/recording session, not an auth session.
        - "**/storage/**"
        - "**/replay/**"
        - "**/recorder/**"
