rules:
  - id: no-secret-logging
    languages: [python]
    severity: ERROR
    message: >-
      SR-122: a password, token, session id, TOTP code, recovery code or
      invite token variable reaches a logger. Log an opaque id instead.
    metadata:
      sr: SR-122
    patterns:
      - pattern-either:
          - pattern: $L.$M(..., $V, ...)
          - pattern: $L.$M(..., $K=$V, ...)
          - pattern: $L.$M(f"...{$V}...", ...)
          - pattern: $L.$M($S % $V, ...)
      - metavariable-regex:
          metavariable: $L
          regex: "(?i)^(logger|logging|log|_logger|_log)$"
      - metavariable-regex:
          metavariable: $M
          regex: "^(debug|info|warning|warn|error|exception|critical|log)$"
      - metavariable-regex:
          metavariable: $V
          regex: "(?i)^(password|passwd|pwd|.*_password|token|.*_token|session_id|session_token|totp|totp_code|totp_secret|otp|recovery_code|recovery_codes)$"
    paths:
      exclude:
        - "**/tests/**"
        # session_id here is a replay/recording session, not an auth session.
        - "**/storage/**"
        - "**/replay/**"
        - "**/recorder/**"
