packages:
  - "apps/*"
  - "packages/*"

# Supply-chain hardening (C-12.3): .npmrc sets ignore-scripts=true globally.
# esbuild (a transitive dev-dependency of vitest) and electron (E02-T04,
# apps/desktop) ship legitimate, widely audited postinstall scripts that
# fetch their platform binary; both are explicitly allowlisted here rather
# than disabling ignore-scripts repo-wide. Any future addition to this list
# needs the same review note.
allowBuilds:
  electron: true
  esbuild: true

# E43-T05 (SR-130/SR-156): force patched transitive `tar` (electron-builder >
# app-builder-lib, build-time only) past GHSA-23hp-3jrh-7fpw and the other
# tar advisories. Remove once electron-builder ships tar>=7.5.21 itself.
overrides:
  tar: ">=7.5.21"
