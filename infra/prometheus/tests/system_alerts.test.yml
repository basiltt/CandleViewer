# promtool test rules (E04-T05). Generated by infra/alertmanager/gen_promtool_tests.py.
rule_files:
- ../alerts/system_page.yml
- ../alerts/system_ticket.yml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: naked_position_alerts_total
    values: 0+0x10 1+0x10
  alert_rule_test:
  - eval_time: 15m
    alertname: NakedPositionDetected
    exp_alerts:
    - exp_labels:
        severity: page
        component: oms
- interval: 1m
  input_series:
  - series: naked_position_alerts_total
    values: 0+0x20
  alert_rule_test:
  - eval_time: 15m
    alertname: NakedPositionDetected
    exp_alerts: []
- interval: 1m
  input_series:
  - series: oms_unknown_orders
    values: 0 2+0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: OmsUnknownOrders
    exp_alerts:
    - exp_labels:
        severity: page
        component: oms
- interval: 1m
  input_series:
  - series: oms_unknown_orders
    values: 0+0x12
  alert_rule_test:
  - eval_time: 5m
    alertname: OmsUnknownOrders
    exp_alerts: []
- interval: 1m
  input_series:
  - series: pg_up
    values: 0+0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: PostgresDown
    exp_alerts:
    - exp_labels:
        severity: page
        component: postgres
- interval: 1m
  input_series:
  - series: pg_up
    values: 1+0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: PostgresDown
    exp_alerts: []
- interval: 1m
  input_series:
  - series: bybit_clock_drift_ms
    values: 2000+0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: ClockDriftBlockingTrading
    exp_alerts:
    - exp_labels:
        severity: page
        component: clock
- interval: 1m
  input_series:
  - series: bybit_clock_drift_ms
    values: 10+0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: ClockDriftBlockingTrading
    exp_alerts: []
- interval: 1m
  input_series:
  - series: disk_used_ratio
    values: 0.97+0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: DiskCritical
    exp_alerts:
    - exp_labels:
        severity: page
        component: storage
- interval: 1m
  input_series:
  - series: disk_used_ratio
    values: 0.5+0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: DiskCritical
    exp_alerts: []
- interval: 1m
  input_series:
