apiVersion: 1

providers:
  - name: candleviewer
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false   # UI edits cannot persist; repo JSON is restored on restart
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
